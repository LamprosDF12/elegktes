<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

/* SEARCH */
.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* CONTAINER */
.container {
  display: flex;
  flex-direction: column;
  padding: 15px;
  gap: 12px;
  max-width: 800px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* HEADER INSIDE CARD */
.card-header {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 110px;
  height: auto;
}

.code {
  color: #555;
  font-size: 14px;
}

/* BUTTON */
.btn {
  margin-top: 10px;
  padding: 8px 12px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.btn:hover {
  background: #2980b9;
}

/* MODAL (FIXED FRONT LAYER) */
.modal {
  display: none;
  position: fixed;
  z-index: 999999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);

  display: flex;
  align-items: center;
  justify-content: center;
}

/* MODAL CONTENT */
.modal-content {
  position: relative;
  background: white;
  padding: 10px;
  border-radius: 10px;
  width: 95%;
  max-width: 1000px;
  max-height: 90vh;
  overflow: auto;
}

/* IMAGE */
.modal-content img {
  width: 100%;
  display: block;
}

/* CLOSE BUTTON */
.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A. A.E.</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Αναζήτηση..." onkeyup="searchFunction()">
</div>

<!-- MODAL -->

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <img src="apofasi_orismou.jpg">
  </div>
</div>

<script>

/* OPEN MODAL */
function openModal() {
  document.getElementById("modal").style.display = "flex";
}

/* CLOSE MODAL */
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* CLICK OUTSIDE CLOSE */
window.onclick = function(e) {
  const modal = document.getElementById("modal");
  if (e.target === modal) {
    closeModal();
  }
};

/* SEARCH */
function searchFunction() {
  const input = document.getElementById("searchInput");
  const filter = input.value.toLowerCase();
  const cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    let text = cards[i].innerText.toLowerCase();
    cards[i].style.display = text.includes(filter) ? "" : "none";
  }
}
</script>

</body>

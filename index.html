<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  display: flex;
  flex-direction: column;
  padding: 15px;
  gap: 12px;
  max-width: 800px;
  margin: auto;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 110px;
}

.btn {
  margin-top: 10px;
  padding: 8px 12px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.btn:hover {
  background: #2980b9;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
}

.modal-content {
  margin: 2% auto;
  width: 95%;
  max-width: 1000px;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

.close {
  float: right;
  font-size: 28px;
  cursor: pointer;
}

.modal img {
  width: 100%;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A. A.E.</div>

<div class="container">

<!-- CARD 1 -->

<div class="card">
  <div class="card-header">
    <img src="eetaa_logo.png" class="logo">
    <div>
      <strong>Προμπονάς Ανδρέας</strong><br>
      Κωδικός: ELG001
    </div>
  </div>

  <br>

📞 <a href="tel:+2131320683">+2131320683</a><br>
✉️ <a href="mailto:promponas@eetaa.gr">[promponas@eetaa.gr](mailto:promponas@eetaa.gr)</a><br>

<button class="btn openBtn">📄 Απόφαση Ορισμού</button>

</div>

<!-- CARD 2 -->

<div class="card">
  <div class="card-header">
    <img src="eetaa_logo.png" class="logo">
    <div>
      <strong>Αμοιρίδου Στέλλα</strong><br>
      Κωδικός: ELG002
    </div>
  </div>

  <br>

📞 <a href="tel:+2310544714">+2310544714</a><br>
✉️ <a href="mailto:amiridou@eetaa.gr">[amiridou@eetaa.gr](mailto:amiridou@eetaa.gr)</a><br>

<button class="btn openBtn">📄 Απόφαση Ορισμού</button>

</div>

</div>

<!-- MODAL -->

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <img src="apofasi_orismou.jpg">
  </div>
</div>

<script>
/* OPEN */
document.querySelectorAll(".openBtn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.getElementById("modal").style.display = "block";
  });
});

/* CLOSE */
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* CLICK OUTSIDE */
window.onclick = function(e) {
  const modal = document.getElementById("modal");
  if (e.target === modal) {
    closeModal();
  }
};
</script>

</body>
</html>

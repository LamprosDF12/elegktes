<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 18px;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card-header {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 100px;
}

.code {
  color: #555;
  font-size: 14px;
}

.info {
  margin-top: 5px;
  font-size: 14px;
}

.btn {
  margin-top: 10px;
  padding: 8px 12px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.btn:hover {
  background: #2980b9;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 10px;
  border-radius: 10px;
  width: 95%;
  max-width: 1000px;
  max-height: 90vh;
  overflow: auto;
  position: relative;
}

.modal img {
  width: 100%;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 28px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A. A.E.</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Αναζήτηση..." onkeyup="searchFunction()">
</div>

<div class="container">

<script>

document.write(
  data.map(e => `

      <div class="card-header">

        <div>
          <strong>${e[0]}</strong><br>

        </div>

      <div class="info">

</div>

<!-- MODAL -->

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <img src="apofasi_orismou.jpg">
  </div>
</div>

<script>

function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

window.onclick = function(e) {
  if (e.target.id === "modal") closeModal();
};

function searchFunction() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    cards[i].style.display =
      cards[i].innerText.toLowerCase().includes(input) ? "" : "none";
  }
}
</script>

</body>
</html>

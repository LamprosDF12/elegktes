<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

/* HEADER */
.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

/* CONTAINER */
.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  position: relative;
  z-index: 1;
}

/* LEFT */
.left {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  width: 120px;
}

/* 🔥 BUTTON FIXED (crucial) */
.btn {
  margin-top: 8px;
  padding: 6px 10px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  z-index: 2;
  position: relative;
}

/* RIGHT */
.info {
  flex: 1;
}

.name {
  font-weight: bold;
  font-size: 16px;
}

.code {
  font-size: 12px;
  color: #777;
  margin-top: 2px;
}

/* LINKS */
a {
  color: #2980b9;
  text-decoration: none;
}

/* 🔥 MODAL FIX (VERY IMPORTANT) */
.modal {
  display: none;
  position: fixed;
  z-index: 999999999; /* ultra high */
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.92);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal img {
  max-width: 95vw;
  max-height: 95vh;
}

.close {
  position: absolute;
  top: 20px;
  right: 25px;
  font-size: 34px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A.</div>

<div class="container" id="container"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>
  <img src="apofasi_orismou.jpg">
</div>

<script>

const data = [
["ELG001","Προμπονάς Ανδρέας","2131320683","promponas@eetaa.gr"],
["ELG002","Αμοιρίδου Στέλλα","2310544714","amiridou@eetaa.gr"],
["ELG003","Βαλάκας Χρήστος","2410579220","valakas@eetaa.gr"],
["ELG004","Γεωργίου Αλέξανδρος","2131320762","ageo@eetaa.gr"],
["ELG005","Γκούτσια Ευαγγελία","2131320682","goutsia@eetaa.gr"]
];

const container = document.getElementById("container");

data.forEach(e => {

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="left">
      <img src="eetaa_logo.png" class="logo">
      <button class="btn" onclick="openModal()">Απόφαση</button>
    </div>

    <div class="info">
      <div class="name">${e[1]}</div>
      <div class="code">${e[0]}</div>
      📞 <a href="tel:+30${e[2]}">${e[2]}</a><br>
      ✉️ <a href="mailto:${e[3]}">${e[3]}</a>
    </div>
  `;

  container.appendChild(card);
});

/* 🔥 MODAL FIXED JS */
function openModal() {
  const modal = document.getElementById("modal");
  modal.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  const modal = document.getElementById("modal");
  modal.classList.remove("show");
  document.body.style.overflow = "auto";
}

/* click outside closes */
document.getElementById("modal").addEventListener("click", function(e) {
  if (e.target.id === "modal") {
    closeModal();
  }
});
</script>

</body>
</html>

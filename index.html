<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEST ΑΠΟΦΑΣΗ</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  margin: 0;
  text-align: center;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  font-size: 18px;
}

/* BUTTON */
.btn {
  margin: 20px;
  padding: 10px 15px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  overflow: auto;
}

/* CONTENT */
.modal-content {
  background: white;
  margin: 2% auto;
  padding: 10px;
  width: 95%;
  max-width: 900px;
  border-radius: 10px;

  /* 🔥 σημαντικό για Α4 */
  max-height: 95vh;
  overflow-y: auto;
}

/* IMAGE FIX (Α4 JPG) */
.modal-content img {
  width: 100%;
  height: auto;
  max-height: 90vh;
  object-fit: contain;
  display: block;
}

/* CLOSE */
.close {
  float: right;
  font-size: 28px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">TEST ΑΠΟΦΑΣΗ ΟΡΙΣΜΟΥ (Α4 JPG)</div>

<button class="btn" onclick="openModal()">Άνοιγμα Απόφασης</button>

<div id="modal" class="modal" onclick="closeModal()">

  <div class="modal-content" onclick="event.stopPropagation()">

    <span class="close" onclick="closeModal()">&times;</span>

    <!-- 🔥 ΕΔΩ ΒΑΖΕΙΣ ΤΟ JPG -->
    <img src="apofasi_orismou.jpg" alt="Απόφαση">

  </div>
</div>

<script>
function openModal(){
  document.getElementById("modal").style.display = "block";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>

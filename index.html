<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>QR Επαλήθευση Ελεγκτή</title>

<script src="data.js"></script>
<script src="data-layer.js"></script>

<style>
body{font-family:Arial;text-align:center;padding:20px;}
.card{border:1px solid #ccc;padding:15px;margin:auto;max-width:400px;}
button{padding:10px;margin-top:10px;width:100%;}
img{max-width:100%;}
</style>
</head>

<body>

<h2>Επαλήθευση Ελεγκτή</h2>

<div class="card" id="box">
Φόρτωση...
</div>

<script>

const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const token = params.get("token");

const data = window.ELEGKTES[id];

const box = document.getElementById("box");

if (!data || data.token !== token) {
  box.innerHTML = "<h3>❌ Μη έγκυρο QR</h3>";
} else {
  box.innerHTML = `
    <h3>${data.name}</h3>
    <p>📞 ${data.phone}</p>
    <p>📧 ${data.email}</p>

    <button onclick="window.open('${data.decision}')">
      📄 Απόφαση Ορισμού
    </button>
  `;
}

</script>

</body>
</html>

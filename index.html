<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

/* CONTAINER */
.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  align-items: flex-start;
  gap: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* LEFT SIDE */
.left {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  width: 120px;
}

.btn {
  margin-top: 8px;
  padding: 6px 10px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
}

/* RIGHT SIDE */
.info {
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* NAME */
.name {
  font-weight: bold;
  font-size: 16px;
  width: 100%;
}

/* CODE (FIXED LEFT ALIGN) */
.code {
  font-size: 12px;
  color: #777;
  margin-top: 2px;
  width: 100%;
  text-align: left;   /* 🔥 ΣΩΣΤΟ */
}

/* CONTACT */
.contact {
  margin-top: 8px;
  font-size: 14px;
}

a {
  color: #2980b9;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal img {
  max-width: 95vw;
  max-height: 95vh;
}

.close {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 32px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A.</div>

<div class="container" id="container"></div>

<!-- MODAL -->
<div id="modal" class="modal">
<span class="close" onclick="closeModal()">&times;</span>
<img src="apofasi_orismou.jpg">
</div>

<script>

const data = [
["ELG001","Προμπονάς Ανδρέας","2131320683","promponas@eetaa.gr"],
["ELG002","Αμοιρίδου Στέλλα","2310544714","amiridou@eetaa.gr"],
["ELG003","Βαλάκας Χρήστος","2410579220","valakas@eetaa.gr"],
["ELG004","Γεωργίου Αλέξανδρος","2131320762","ageo@eetaa.gr"],
["ELG005","Γκούτσια Ευαγγελία","2131320682","goutsia@eetaa.gr"],
["ELG006","Δημάκη Ελένη","2131320739","dimaki@eetaa.gr"],
["ELG007","Δόμβρη Ελένη","2310544714","domvri@eetaa.gr"],
["ELG008","Ευφραιμίδου Γαλήνη","2310544714","galini@eetaa.gr"],
["ELG009","Ηλιοπούλου Κωνσταντίνα","2131320755","nilio@eetaa.gr"],
["ELG010","Καλλές Θεόδωρος","2131320751","kalles@eetaa.gr"]
];

const container = document.getElementById("container");

data.forEach(e => {

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <div class="left">
      <img src="eetaa_logo.png" class="logo">
      <button class="btn" onclick="openModal()">Απόφαση</button>
    </div>

    <div class="info">
      <div class="name">${e[1]}</div>
      <div class="code">${e[0]}</div>

      <div class="contact">
        📞 <a href="tel:+30${e[2]}">${e[2]}</a><br>
        ✉️ <a href="mailto:${e[3]}">${e[3]}</a>
      </div>
    </div>
  `;

  container.appendChild(card);
});

/* MODAL */
function openModal() {
  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

/* close outside */
document.getElementById("modal").addEventListener("click", e => {
  if (e.target.id === "modal") closeModal();
});
</script>

</body>
</html>

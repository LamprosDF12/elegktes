<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.container {
  display: flex;
  flex-direction: column;
  padding: 15px;
  gap: 12px;
  max-width: 800px;
  margin: auto;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.card-header {
  display: flex;
  align-items: center;
  gap: 15px;
}

.logo {
  width: 110px;
}

.code {
  color: #555;
}

.btn {
  margin-top: 10px;
  padding: 8px 12px;
  background: #3498db;
  color: white;
  border-radius: 5px;
  border: none;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
}

.modal-content {
  margin: 2% auto;
  width: 95%;
  max-width: 1000px;
  background: white;
  padding: 10px;
  border-radius: 10px;
}

.close {
  float: right;
  font-size: 28px;
  cursor: pointer;
}

/* ZOOM AREA */
.zoom-container {
  overflow: hidden;
  text-align: center;
}

.zoom-container img {
  width: 100%;
  transform-origin: center center;
  transition: transform 0.2s;
}

/* CONTROLS */
.controls {
  text-align: center;
  margin-bottom: 10px;
}

.controls button {
  margin: 5px;
  padding: 8px 12px;
  font-size: 16px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A. A.E.</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Αναζήτηση..." onkeyup="searchFunction()">
</div>

<div class="container" id="container"></div>

<!-- MODAL -->

<div id="imgModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>

```
<div class="controls">
  <button onclick="zoomIn()">➕</button>
  <button onclick="zoomOut()">➖</button>
  <button onclick="resetZoom()">🔄</button>
</div>

<div class="zoom-container">
  <img id="modalImage" src="apofasi_orismou.jpg">
</div>
```

  </div>
</div>

<script>
const elenktes = [
["Προμπονάς Ανδρέας","ELG001","+2131320683","promponas@eetaa.gr"],
["Αμοιρίδου Στέλλα","ELG002","+2310544714","amiridou@eetaa.gr"],
["Βαλάκας Χρήστος","ELG003","+2410579220","valakas@eetaa.gr"],
["Γεωργίου Αλέξανδρος","ELG004","+2131320762","ageo@eetaa.gr"],
["Γκούτσια Ευαγγελία","ELG005","+2131320682","goutsia@eetaa.gr"],
["Δημάκη Ελένη","ELG006","+2131320739","dimaki@eetaa.gr"],
["Δόμβρη Ελένη","ELG007","+2310544714","domvri@eetaa.gr"],
["Ευφραιμίδου Γαλήνη","ELG008","+2310544714","galini@eetaa.gr"],
["Ηλιοπούλου Κωνσταντίνα","ELG009","+2131320755","nilio@eetaa.gr"],
["Καλλές Θεόδωρος","ELG010","+2131320751","kalles@eetaa.gr"],
["Καρβελάς Κωνσταντίνος","ELG011","+2131320723","kkarv@eetaa.gr"],
["Κόντου Ζωή","ELG012","+2131320645","kondou@eetaa.gr"],
["Κουνενής Λάμπρος","ELG013","+2131320633","lkoun@eetaa.gr"],
["Κουλοχέρη Μαρία","ELG014","+2410579220","koulocheri@eetaa.gr"],
["Μιχαηλίδου Κατερίνα","ELG015","+2310544714","mihailidou@eetaa.gr"],
["Μπίτης Νικόλαος","ELG016","+2410579220","nbitis@eetaa.gr"],
["Παπαπαναγιώτου Κωνσταντίνος","ELG017","+2131320676","papapanagiotou@eetaa.gr"],
["Σαλτζίδου Θεοφανεία","ELG018","+2310544714","fsaltzidou@eetaa.gr"],
["Σούρτζης Γεώργιος","ELG019","+2410579220","sourtzis@eetaa.gr"],
["Τσιρώνης Νικόλαος","ELG020","+2131320658","ntsir@eetaa.gr"]
];

const container = document.getElementById("container");

elenktes.forEach(e => {
  container.innerHTML += `
    <div class="card">
      <div class="card-header">
        <img src="eetaa_logo.png" class="logo">
        <div>
          <strong>${e[0]}</strong><br>
          <span class="code">Κωδικός: ${e[1]}</span>
        </div>
      </div>

      <br>

      📞 <a href="tel:${e[2]}">${e[2]}</a><br>
      ✉️ <a href="mailto:${e[3]}">${e[3]}</a><br>

      <button class="btn" onclick="openModal()">📄 Απόφαση</button>
    </div>
  `;
});

let scale = 1;

function openModal() {
  document.getElementById("imgModal").style.display = "block";
}

function closeModal() {
  document.getElementById("imgModal").style.display = "none";
}

function zoomIn() {
  scale += 0.2;
  applyZoom();
}

function zoomOut() {
  scale -= 0.2;
  if (scale < 1) scale = 1;
  applyZoom();
}

function resetZoom() {
  scale = 1;
  applyZoom();
}

function applyZoom() {
  document.getElementById("modalImage").style.transform = "scale(" + scale + ")";
}

/* wheel zoom */
document.addEventListener("wheel", function(e) {
  if (document.getElementById("imgModal").style.display === "block") {
    e.preventDefault();
    if (e.deltaY < 0) zoomIn();
    else zoomOut();
  }
}, { passive: false });

function searchFunction() {
  const input = document.getElementById("searchInput");
  const filter = input.value.toLowerCase();
  const cards = document.getElementsByClassName("card");

  for (let i = 0; i < cards.length; i++) {
    let text = cards[i].innerText.toLowerCase();
    cards[i].style.display = text.includes(filter) ? "" : "none";
  }
}
</script>

</body>
</html>

<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 18px;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* CONTAINER */
.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 15px;
  align-items: stretch;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: 0.3s;
}

/* LOGO BIG */
.logo {
  width: 140px;
  object-fit: contain;
  flex-shrink: 0;
}

/* INFO */
.card-info {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.name {
  font-weight: bold;
  font-size: 16px;
}

.code {
  color: #555;
}

.info {
  margin-top: 6px;
  font-size: 14px;
  line-height: 1.4;
}

.btn {
  margin-top: 10px;
  padding: 8px 12px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

/* HIGHLIGHT */
.highlight {
  border: 3px solid #e74c3c;
  background: #fff5f5;
  transform: scale(1.02);
}

/* 🔥 FOCUS MODE */
.focus-mode .card {
  display: none;
}

.focus-mode .card.active {
  display: flex;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal-content {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 95vw;
  max-height: 95vh;
  object-fit: contain;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A. A.E.</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Αναζήτηση..." onkeyup="searchFunction()">
</div>

<button id="exitBtn" onclick="exitFocus()" style="
display:none;
margin:10px auto;
padding:8px 12px;
border:none;
background:#2c3e50;
color:white;
border-radius:6px;
cursor:pointer;
">
👁️ Εμφάνιση όλων </button>

<div class="container">

<script>

document.write(
data.map(e => `
<div class="card" id="${e[0]}">
  <img src="eetaa_logo.png" class="logo">

  <div class="card-info">

    <div class="info">

</div>

<!-- MODAL -->

<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <img src="apofasi_orismou.jpg">
  </div>
</div>

<script>

/* MODAL */
function openModal() {
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* SEARCH */
function searchFunction() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for (let c of cards) {
    c.style.display = c.innerText.toLowerCase().includes(input) ? "" : "none";
  }
}

/* 🔥 QR + FOCUS MODE */
document.addEventListener("DOMContentLoaded", () => {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) return;

  const el = document.getElementById(id);

  if (el) {
    document.body.classList.add("focus-mode");

    el.classList.add("active");

    document.getElementById("exitBtn").style.display = "block";

    setTimeout(() => {
      el.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }, 200);
  }
});

/* EXIT */
function exitFocus() {
  document.body.classList.remove("focus-mode");

  document.querySelectorAll(".card").forEach(c => {
    c.classList.remove("active");
  });

  document.getElementById("exitBtn").style.display = "none";
}

/* MODAL CLOSE */
window.onclick = function(e) {
  if (e.target.id === "modal") closeModal();
};
</script>

</body>
</html>

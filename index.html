<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

.search-box {
  padding: 15px;
  text-align: center;
  visibility: hidden;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.highlight {
  border: 3px solid red;
  background: #fff3f3;
}

.left {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  width: 120px;
}

.btn {
  margin-top: 8px;
  padding: 6px 10px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.info {
  flex: 1;
}

.name {
  font-weight: bold;
}

.code {
  font-size: 12px;
  color: #777;
}

.contact {
  margin-top: 10px;
}

a {
  color: #2980b9;
}

/* GDPR */
.gdpr {
  font-size: 10px;
  color: #666;
  margin-top: 20px;
  line-height: 1.3;
  text-align: justify;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal img {
  max-width: 95%;
  max-height: 95%;
}

.close {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A.</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Αναζήτηση..." onkeyup="search()">
</div>

<div class="container" id="container"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>
  <img src="apofasi_orismou.jpg">
</div>

<script>

const data = [
["ELG001","Προμπονάς Ανδρέας","2131320683","promponas@eetaa.gr"],
["ELG002","Αμοιρίδου Στέλλα","2310544714","amiridou@eetaa.gr"],
["ELG003","Βαλάκας Χρήστος","2410579220","valakas@eetaa.gr"],
["ELG004","Γεωργίου Αλέξανδρος","2131320762","ageo@eetaa.gr"],
["ELG005","Γκούτσια Ευαγγελία","2131320682","goutsia@eetaa.gr"],
["ELG006","Δημάκη Ελένη","2131320739","dimaki@eetaa.gr"],
["ELG007","Δόμβρη Ελένη","2310544714","domvri@eetaa.gr"]
];

const GDPR_TEXT = `
Τα στοιχεία που εμφανίζονται στην παρούσα ιστοσελίδα (ονοματεπώνυμο, υπηρεσιακό τηλέφωνο και υπηρεσιακή διεύθυνση ηλεκτρονικού ταχυδρομείου) αφορούν αποκλειστικά υπηρεσιακά δεδομένα ελεγκτών και χρησιμοποιούνται για ταυτοποίηση και υπηρεσιακή επικοινωνία.

Η επεξεργασία πραγματοποιείται σύμφωνα με τον ΓΚΠΔ (ΕΕ) 2016/679.

Η ιστοσελίδα δεν συλλέγει δεδομένα επισκεπτών και δεν χρησιμοποιεί cookies.

Για πληροφορίες DPO: 213-1320701, dpo@eetaa.gr.
`;

const container = document.getElementById("container");

/* CREATE CARDS (ίδιο pattern όπως αρχικό σου) */
data.forEach(e => {

  const card = document.createElement("div");
  card.className = "card";
  card.id = e[0];

  card.innerHTML = `
    <div class="left">
      <img src="eetaa_logo.png" class="logo">
      <button class="btn" onclick="openModal()">Απόφαση</button>
    </div>

    <div class="info">
      <div class="name">${e[1]}</div>
      <div class="code">${e[0]}</div>

      <div class="contact">
        📞 <a href="tel:+30${e[2]}">${e[2]}</a><br>
        ✉️ <a href="mailto:${e[3]}">${e[3]}</a>
      </div>

      <div class="gdpr">${GDPR_TEXT}</div>
    </div>
  `;

  container.appendChild(card);
});

/* SEARCH */
function search() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(input) ? "flex" : "none";
  });
}

/* MODAL */
function openModal() {
  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

/* =========================
   QR FOCUS (SAFE + STABLE)
========================= */
window.onload = function() {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (id) {

    const target = document.getElementById(id);

    if (target) {

      target.classList.add("highlight");

      document.querySelectorAll(".card").forEach(c => {
        if (c.id !== id) c.style.display = "none";
      });

      setTimeout(() => {
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 80);

    } else {
      container.innerHTML = "Δεν βρέθηκε ελεγκτής";
    }
  }
};

</script>

</body>
</html>

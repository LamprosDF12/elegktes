<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  border-radius: 8px;
}

/* CONTAINER */
.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 15px;
  align-items: stretch;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  transition: 0.3s;
}

/* LEFT */
.left {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 140px;
}

.logo {
  width: 120px;
  object-fit: contain;
}

.btn {
  margin-top: 8px;
  padding: 6px 10px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
}

/* RIGHT */
.info {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.name {
  font-weight: bold;
}

.code {
  color: #666;
}

/* HIGHLIGHT */
.highlight {
  border: 3px solid #e74c3c;
  background: #fff5f5;
}

/* FOCUS MODE */
.focus-mode .card {
  display: none;
}

.focus-mode .card.active {
  display: flex;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 9999;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 95vw;
  max-height: 95vh;
}

.close {
  position: absolute;
  top: 10px;
  right: 15px;
  color: white;
  font-size: 30px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A.</div>

<div class="search-box">
<input type="text" onkeyup="search()" placeholder="🔍 Αναζήτηση...">
</div>

<button id="exitBtn" onclick="exitFocus()" style="display:none; margin:10px auto;">
👁️ Εμφάνιση όλων
</button>

<div class="container" id="container"></div>

<!-- MODAL -->

<div id="modal" class="modal" onclick="closeModal()">
<span class="close">&times;</span>
<img src="apofasi_orismou.jpg">
</div>

<script>

const data = [
["ELG001","Προμπονάς Ανδρέας","2131320683","promponas@eetaa.gr"],
["ELG002","Αμοιρίδου Στέλλα","2310544714","amiridou@eetaa.gr"],
["ELG003","Βαλάκας Χρήστος","2410579220","valakas@eetaa.gr"],
["ELG004","Γεωργίου Αλέξανδρος","2131320762","ageo@eetaa.gr"],
["ELG005","Γκούτσια Ευαγγελία","2131320682","goutsia@eetaa.gr"],
["ELG006","Δημάκη Ελένη","2131320739","dimaki@eetaa.gr"],
["ELG007","Δόμβρη Ελένη","2310544714","domvri@eetaa.gr"],
["ELG008","Ευφραιμίδου Γαλήνη","2310544714","galini@eetaa.gr"],
["ELG009","Ηλιοπούλου Κωνσταντίνα","2131320755","nilio@eetaa.gr"],
["ELG010","Καλλές Θεόδωρος","2131320751","kalles@eetaa.gr"],
["ELG011","Καρβελάς Κωνσταντίνος","2131320723","kkarv@eetaa.gr"],
["ELG012","Κόντου Ζωή","2131320645","kondou@eetaa.gr"],
["ELG013","Κουνενής Λάμπρος","2131320633","lkoun@eetaa.gr"],
["ELG014","Κουλοχέρη Μαρία","2410579220","koulocheri@eetaa.gr"],
["ELG015","Μιχαηλίδου Κατερίνα","2310544714","mihailidou@eetaa.gr"],
["ELG016","Μπίτης Νικόλαος","2410579220","nbitis@eetaa.gr"],
["ELG017","Παπαπαναγιώτου Κωνσταντίνος","2131320676","papapanagiotou@eetaa.gr"],
["ELG018","Σαλτζίδου Θεοφανεία","2310544714","fsaltzidou@eetaa.gr"],
["ELG019","Σούρτζης Γεώργιος","2410579220","sourtzis@eetaa.gr"],
["ELG020","Τσιρώνης Νικόλαος","2131320658","ntsir@eetaa.gr"]
];

const container = document.getElementById("container");

data.forEach(e => {
  const card = document.createElement("div");
  card.className = "card";
  card.id = e[0];

  card.innerHTML = `
    <div class="left">
      <img src="eetaa_logo.png" class="logo">
      <button class="btn" onclick="openModal()">Απόφαση</button>
    </div>

    <div class="info">
      <div class="name">${e[1]}</div>
      <div class="code">${e[0]}</div>
      📞 ${e[2]}<br>
      ✉️ ${e[3]}
    </div>
  `;

  container.appendChild(card);
});

/* SEARCH */
function search() {
  let val = event.target.value.toLowerCase();
  document.querySelectorAll(".card").forEach(c => {
    c.style.display = c.innerText.toLowerCase().includes(val) ? "flex" : "none";
  });
}

/* MODAL */
function openModal() {
  document.getElementById("modal").style.display = "flex";
}
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

/* FOCUS MODE FIXED */
document.addEventListener("DOMContentLoaded", () => {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id) return;

  const el = document.getElementById(id);

  if (el) {
    document.body.classList.add("focus-mode");

    el.classList.add("active");

    document.getElementById("exitBtn").style.display = "block";

    setTimeout(() => {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 200);
  }
});

/* EXIT */
function exitFocus() {
  document.body.classList.remove("focus-mode");
  document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
  document.getElementById("exitBtn").style.display = "none";
}
</script>

</body>
</html>

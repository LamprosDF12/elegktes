<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  align-items: flex-start;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.left {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  width: 120px;
}

.btn {
  margin-top: 8px;
  padding: 6px 10px;
  background: #27ae60; /* πράσινο για διαφοροποίηση */
  color: white;
  border-radius: 5px;
  text-decoration: none;
  font-size: 12px;
}

.info {
  flex: 1;
}

.name {
  font-weight: bold;
  font-size: 16px;
}

.code {
  font-size: 12px;
  color: #777;
  margin-top: 2px;
}

.contact {
  margin-top: 10px;
  line-height: 1.6;
}

a {
  color: #2980b9;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A.</div>

<div class="container" id="container"></div>

<script>

const data = [
["ELG001","Προμπονάς Ανδρέας","2131320683","promponas@eetaa.gr"],

["ELG005","Γκούτσια Ευαγγελία","2131320682","goutsia@eetaa.gr"],
["ELG006","Δημάκη Ελένη","2131320739","dimaki@eetaa.gr"],
["ELG007","Δόμβρη Ελένη","2310544714","domvri@eetaa.gr"],
["ELG008","Ευφραιμίδου Γαλήνη","2310544714","galini@eetaa.gr"],

["ELG010","Καλλές Θεόδωρος","2131320751","kalles@eetaa.gr"],
["ELG011","Καρβελάς Κωνσταντίνος","2131320723","kkarv@eetaa.gr"],

const container = document.getElementById("container");

data.forEach(e => {

        Απόφαση
      </a>
    </div>

    <div class="info">
      <div class="name">${e[1]}</div>
      <div class="code">${e[0]}</div>

      <div class="contact">
        📞 <a href="tel:+30${e[2]}">${e[2]}</a><br>
        ✉️ <a href="mailto:${e[3]}">${e[3]}</a>
      </div>
    </div>
  `;

  container.appendChild(card);
});

</script>

</body>
</html>

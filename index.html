<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

.search-box {
  padding: 15px;
  text-align: center;
  visibility: hidden;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

/* CARD */
.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* highlight */
.highlight {
  border: 3px solid red;
  background: #fff3f3;
}

/* LEFT */
.left {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  width: 120px;
}

.btn {
  margin-top: 8px;
  padding: 6px 10px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

/* RIGHT */
.info {
  flex: 1;
}

.name {
  font-weight: bold;
}

.code {
  font-size: 12px;
  color: #777;
}

.contact {
  margin-top: 10px;
}

a {
  color: #2980b9;
}

/* GDPR TEXT */
.gdpr {
  font-size: 10px;
  color: #666;
  margin-top: 20px;
  line-height: 1.3;
  text-align: justify;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal img {
  max-width: 95%;
  max-height: 95%;
}

.close {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A.</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Αναζήτηση..." onkeyup="search()">
</div>

<div class="container" id="container"></div>

<!-- MODAL -->
<div id="modal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>
  <img src="apofasi_orismou.jpg">
</div>

<script>

const data = [
["ELG001","Προμπονάς Ανδρέας","2131320683","promponas@eetaa.gr"],
["ELG002","Αμοιρίδου Στέλλα","2310544714","amiridou@eetaa.gr"],
["ELG003","Βαλάκας Χρήστος","2410579220","valakas@eetaa.gr"],
["ELG004","Γεωργίου Αλέξανδρος","2131320762","ageo@eetaa.gr"],
["ELG005","Γκούτσια Ευαγγελία","2131320682","goutsia@eetaa.gr"],
["ELG006","Δημάκη Ελένη","2131320739","dimaki@eetaa.gr"],
["ELG007","Δόμβρη Ελένη","2310544714","domvri@eetaa.gr"]
];

const GDPR_TEXT = `
Τα στοιχεία που εμφανίζονται στην παρούσα ιστοσελίδα (ονοματεπώνυμο, υπηρεσιακό τηλέφωνο και υπηρεσιακή διεύθυνση ηλεκτρονικού ταχυδρομείου) αφορούν αποκλειστικά σε υπηρεσιακά δεδομένα ελεγκτών του Προγράμματος Προσχολικής Αγωγής και Δημιουργικής Απασχόλησης Παιδιών και δημοσιοποιούνται για σκοπούς ταυτοποίησης και υπηρεσιακής επικοινωνίας, στο πλαίσιο άσκησης των αρμοδιοτήτων τους.

Η επεξεργασία πραγματοποιείται σύμφωνα με τον Γενικό Κανονισμό Προστασίας Δεδομένων (ΕΕ) 2016/679.

Η ιστοσελίδα δεν συλλέγει ούτε αποθηκεύει δεδομένα επισκεπτών.

Για πληροφορίες: DPO Ε.Ε.Τ.Α.Α. Α.Ε., 213-1320701, dpo@eetaa.gr.
`;

const container = document.getElementById("container");

function createCard(e) {

  const card = document.createElement("div");
  card.className = "card";
  card.id = e[0];

  card.innerHTML = `
    <div class="left">
      <img src="eetaa_logo.png" class="logo">
      <button class="btn" onclick="openModal()">Απόφαση</button>
    </div>

    <div class="info">
      <div class="name">${e[1]}</div>
      <div class="code">${e[0]}</div>

      <div class="contact">
        📞 <a href="tel:+30${e[2]}">${e[2]}</a><br>
        ✉️ <a href="mailto:${e[3]}">${e[3]}</a>
      </div>

      <div class="gdpr">${GDPR_TEXT}</div>
    </div>
  `;

  container.appendChild(card);
}

/* =========================
   QR FOCUS (SAFE VERSION)
========================= */
window.addEventListener("load", () => {

  const id = new URLSearchParams(window.location.search).get("id");

  if (!id) {
    data.forEach(createCard);
    return;
  }

  const found = data.find(x => x[0] === id);

  if (!found) {
    container.innerHTML = "Δεν βρέθηκε ελεγκτής";
    return;
  }

  createCard(found);

  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) {
      el.classList.add("highlight");
      el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }, 80);

});

/* MODAL */
function openModal() {
  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

</script>

</body>
</html>

</body>
</html>

<!DOCTYPE html>

<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ελεγκτές E.E.T.A.A.</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

.search-box {
  padding: 15px;
  text-align: center;
  visibility: hidden;
}

.search-box input {
  width: 90%;
  max-width: 500px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 15px;
  max-width: 900px;
  margin: auto;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  display: flex;
  gap: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.highlight {
  border: 3px solid red;
  background: #fff3f3;
}

.left {
  width: 130px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.logo {
  width: 120px;
}

.btn {
  margin-top: 8px;
  padding: 6px 10px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.info {
  flex: 1;
}

.name {
  font-weight: bold;
}

.code {
  font-size: 12px;
  color: #777;
}

.contact {
  margin-top: 10px;
}

a {
  color: #2980b9;
}

/* 🔽 GDPR TEXT */
.privacy {
  font-size: 10px;
  color: #666;
  margin-top: 12px;
  line-height: 1.4;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal img {
  max-width: 95%;
  max-height: 95%;
}

.close {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">Λίστα Ελεγκτών E.E.T.A.A.</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Αναζήτηση..." onkeyup="search()">
</div>

<div class="container" id="container"></div>

<div id="modal" class="modal">
  <span class="close" onclick="closeModal()">&times;</span>
  <img src="apofasi_orismou.jpg">
</div>

<script>

const container = document.getElementById("container");

data.forEach(e => {

      </div>

      <div class="privacy">

   
        Τα στοιχεία που εμφανίζονται στην παρούσα ιστοσελίδα (ονοματεπώνυμο, υπηρεσιακό τηλέφωνο και υπηρεσιακή διεύθυνση ηλεκτρονικού ταχυδρομείου) αφορούν αποκλειστικά σε υπηρεσιακά δεδομένα ελεγκτών του Προγράμματος Προσχολικής Αγωγής και Δημιουργικής Απασχόλησης Παιδιών και δημοσιοποιούνται για σκοπούς ταυτοποίησης και υπηρεσιακής επικοινωνίας.<br><br>

        Για πληροφορίες: dpo@eetaa.gr | 213-1320701
      </div>
    </div>
  `;

  container.appendChild(card);

function search() {
  const input = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(input) ? "flex" : "none";
  });
}

function openModal() {
  document.getElementById("modal").classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (id) {
    const target = document.getElementById(id);

    if (target) {
      target.classList.add("highlight");

      document.querySelectorAll(".card").forEach(c => {
        if (c.id !== id) c.style.display = "none";
      });

      target.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  }
};

</script>

</body>
</html>
